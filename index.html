<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>LCP 2026 小卡蒐集清單</title>
<style>
  :root{
    --bg-0:#120c0a;
    --bg-1:#1b1210;
    --bg-2:#241713;
    --line:#3a2620;
    --ember-1:#ff7a3d;
    --ember-2:#ffb347;
    --magma:#c9432a;
    --text-0:#f4ece6;
    --text-1:#cbb8ad;
    --text-2:#8a7369;
    --got:#2fae6b;
    --got-bg:rgba(47,174,107,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,67,42,0.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,122,61,0.12), transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    padding:20px 14px 60px;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .title-block .eyebrow{
    font-size:11px;
    letter-spacing:3px;
    color:var(--ember-2);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    margin:0;
    font-size:26px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--text-0),var(--ember-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{color:var(--text-2);font-size:13px;margin-top:4px;}

  .stat-ring{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ring{
    width:72px;height:72px;border-radius:50%;
    background:conic-gradient(var(--ember-1) calc(var(--pct,0)*1%), #33221c calc(var(--pct,0)*1%));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    position:relative;
  }
  .ring::before{
    content:"";
    position:absolute;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--bg-0);
  }
  .ring span{position:relative;font-weight:800;font-size:15px;}
  .stat-text .n{font-size:13px;color:var(--text-1);}
  .stat-text .n b{color:var(--text-0);}

  .toolbar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;
  }
  .tab{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-1);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    text-align:center;
    line-height:1.4;
  }
  .tab .cnt{color:var(--text-2);font-weight:500;margin-left:4px;}
  .tab .note{
    display:block;
    font-size:10px;
    font-weight:500;
    letter-spacing:0.5px;
    color:var(--text-2);
    margin-top:1px;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--magma),var(--ember-1));
    border-color:transparent;
    color:#1a0e0a;
  }
  .tab.active .cnt{color:#3a1c0e;}
  .tab.active .note{color:#4a2412;}
  .tab:hover{border-color:var(--ember-1);}
  .tab.dimmed{opacity:0.45;}

  .searchrow{
    display:flex;gap:8px;margin-bottom:8px;
  }
  input[type=text]{
    flex:1;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-0);
    padding:10px 14px;
    border-radius:10px;
    font-size:14px;
  }
  input[type=text]:focus{outline:none;border-color:var(--ember-1);}
  .reset-btn{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-2);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .reset-btn:hover{color:#ff8a7a;border-color:#7a3428;}

  .search-hint{
    font-size:11px;
    color:var(--text-2);
    margin-bottom:18px;
  }
  .search-hint b{color:var(--ember-2);}

  .cat-panel{display:none;}
  .cat-panel.active{display:block;}

  .cat-note-banner{
    display:inline-block;
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--ember-2);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:8px;
    margin-bottom:16px;
  }

  .team-block{
    margin-bottom:22px;
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px 16px;
  }
  .team-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    flex-wrap:wrap;
    gap:6px;
  }
  .team-name{
    font-weight:900;
    font-size:15px;
    letter-spacing:1px;
    color:var(--ember-2);
  }
  .team-name .from-cat{
    font-size:11px;
    font-weight:700;
    color:var(--text-2);
    margin-left:8px;
  }
  .team-progress{font-size:12px;color:var(--text-2);}
  .team-progress b{color:var(--text-1);}
  .team-head-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .team-select-btn{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--text-1);
    font-size:11px;
    font-weight:700;
    padding:4px 9px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
  }
  .team-select-btn:hover{border-color:var(--ember-1);color:var(--text-0);}

  .card-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .card-chip{
    position:relative;
    border:1px solid var(--line);
    background:var(--bg-2);
    color:var(--text-1);
    padding:9px 13px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
    transition:all .12s ease;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card-chip:hover{border-color:var(--ember-1);color:var(--text-0);}
  .card-chip.got{
    background:var(--got-bg);
    border-color:var(--got);
    color:#c9f5da;
  }
  .card-chip .mark{
    width:14px;height:14px;
    border-radius:4px;
    border:1.5px solid var(--text-2);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;
    color:transparent;
  }
  .card-chip.got .mark{
    border-color:var(--got);
    background:var(--got);
    color:#0e1f16;
  }
  .card-chip.hidden{display:none;}

  #teamSearchResults{display:none;}
  #teamSearchResults.active{display:block;}
  #missingView{display:none;}
  #missingView.active{display:block;}
  .team-search-title{
    font-size:13px;
    color:var(--text-1);
    margin-bottom:14px;
  }
  .team-search-title b{color:var(--ember-2);}
  .missing-done{
    padding:40px 20px;
    text-align:center;
    color:var(--got);
    font-weight:700;
    font-size:15px;
  }

  footer{
    text-align:center;
    color:var(--text-2);
    font-size:11px;
    margin-top:30px;
    letter-spacing:1px;
  }

  .loading{
    text-align:center;
    color:var(--text-2);
    padding:40px 0;
    font-size:13px;
  }

  .sync-banner{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:#3a1c14;
    border:1px solid #7a3428;
    color:#ffcfc0;
    font-size:12.5px;
    padding:9px 16px;
    border-radius:999px;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    display:none;
    z-index:50;
    white-space:nowrap;
  }
  .sync-banner.show{display:block;}
  .sync-banner.ok{
    background:#123a24;
    border-color:#2fae6b;
    color:#c9f5da;
  }

  @media (max-width:560px){
    h1{font-size:21px;}
    .stat-ring{width:100%;justify-content:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">LCP 2026 · MADE FOR THIS</div>
      <h1>小卡蒐集盤點</h1>
      <div class="subtitle">點卡片標記持有,進度自動儲存</div>
      <div class="subtitle" style="opacity:0.55;">Threads @kunkuniv</div>
      <div class="subtitle" id="saveStatus" style="margin-top:2px;"></div>
    </div>
    <div class="stat-ring">
      <div class="ring" id="ring"><span id="ringPct">0%</span></div>
      <div class="stat-text">
        <div class="n">已蒐集 <b id="gotCount">0</b> / <span id="totalCount">0</span></div>
        <div class="n" id="catStatLine">目前分類：0 / 0</div>
      </div>
    </div>
  </header>

  <div class="toolbar" id="tabs"></div>

  <div class="searchrow">
    <input type="text" id="search" placeholder="搜尋選手/主播名稱，或輸入隊名如 CFO 查全部類型...">
    <input type="text" id="nicknameInput" placeholder="圖片上的暱稱" style="max-width:150px;">
    <button class="reset-btn" id="exportBtn">📸 匯出蒐集圖</button>
    <button class="reset-btn" id="missingBtn">📋 還沒有的卡</button>
  </div>
  <div class="search-hint">輸入隊名代碼（如 <b>CFO</b>、<b>DCG</b>）可一次看到該隊在所有卡款中的卡片</div>

  <div id="panels">
    <div class="loading">載入進度中...</div>
  </div>

  <div id="teamSearchResults"></div>
  <div id="missingView"></div>

  <footer>資料點擊即儲存 · 僅存於你自己的裝置紀錄</footer>
</div>

<script>
const DATA = {
  "普卡A": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino","Chawy"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang","Refra1n"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody","Rayfarky","Paz"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki","Gloryy","Naul"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca","Skywalk"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller","Bigkoro"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta","Corgi"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie","Hiro02","Warhorse"]
  },
  "普卡B": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki","Gloryy"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie"]
  },
  "閃卡A": {
    "CFO":["Rest","Shadow","Doggo"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie"]
  },
  "閃卡B+隊伍卡": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino","Chawy","隊伍卡"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang","Refra1n","隊伍卡"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody","Paz","隊伍卡"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki","Gloryy","Naul","Taki+Naul","隊伍卡"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca","Skywalk","隊伍卡"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller","Bigkoro","隊伍卡"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta","Corgi","柯基+戰馬","隊伍卡"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie","Warhorse","隊伍卡"],
    "主播/賽評":["Jackie","Section","JR","Mattlin","Rhan","Tommy","Art","Mountain","Zod","Jay","Chenzui"]
  },
  "親簽/印簽": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody"],
    "GAM":["Kiaya","Draktharr","Aress(印)","Artemis","Taki","Gloryy"],
    "GZ":["1Jiang","Husha","JimieN(印)","Shunn(印)","Orca(印)"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie"]
  }
};

const CAT_NOTES = {
  "普卡A": "證件照去背",
  "普卡B": "有場館背景",
  "閃卡A": "有隊名背景",
  "閃卡B+隊伍卡": "銀色外框"
};

const TEAM_CODES = ["CFO","DCG","DFM","GAM","GZ","MVK","SHG","TSW"];

const STORAGE_KEY = "lcp2026_owned_cards";
const NICKNAME_KEY = "lcp2026_nickname";
let storageBackend = null; // 'claude' 或 'local'

function detectStorageBackend(){
  try{
    if(typeof window.storage !== "undefined" && typeof window.storage.get === "function"){
      storageBackend = "claude";
      return;
    }
  }catch(e){}
  storageBackend = "local";
}

async function storageGetValue(key){
  if(storageBackend === "claude"){
    const result = await window.storage.get(key, false);
    return result ? result.value : null;
  }
  try{
    return window.localStorage.getItem(key);
  }catch(e){
    return null;
  }
}

async function storageSetValue(key, value){
  if(storageBackend === "claude"){
    await window.storage.set(key, value, false);
    return;
  }
  window.localStorage.setItem(key, value);
}

let owned = {};
let activeCat = Object.keys(DATA)[0];
let searchTerm = "";
let teamMatches = [];
let missingViewActive = false;

function cardId(cat, team, card){ return cat+"__"+team+"__"+card; }

function totalCardsInCat(cat){
  return Object.values(DATA[cat]).reduce((s,arr)=>s+arr.length,0);
}
function totalCardsAll(){
  return Object.keys(DATA).reduce((s,cat)=>s+totalCardsInCat(cat),0);
}
function gotCardsInCat(cat){
  let c=0;
  for(const team in DATA[cat]){
    for(const card of DATA[cat][team]){
      if(owned[cardId(cat,team,card)]) c++;
    }
  }
  return c;
}
function gotCardsAll(){
  let c=0;
  for(const k in owned) if(owned[k]) c++;
  return c;
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(DATA).forEach(cat=>{
    const tab = document.createElement("div");
    const isActive = cat===activeCat && teamMatches.length===0;
    tab.className = "tab" + (isActive ? " active":"") + (teamMatches.length>0 ? " dimmed":"");
    const note = CAT_NOTES[cat] ? `<span class="note">${CAT_NOTES[cat]}</span>` : "";
    tab.innerHTML = `${cat} <span class="cnt">${gotCardsInCat(cat)}/${totalCardsInCat(cat)}</span>${note}`;
    tab.onclick = ()=>{
      activeCat = cat;
      document.getElementById("search").value = "";
      searchTerm = "";
      teamMatches = [];
      render();
    };
    tabsEl.appendChild(tab);
  });
}

function isTeamFullyOwned(cat, team){
  return DATA[cat][team].every(card=>owned[cardId(cat,team,card)]);
}

function makeCardGridBlock(cat, team, cards, labelExtra){
  const block = document.createElement("div");
  block.className = "team-block";
  const gotInTeam = cards.filter(c=>owned[cardId(cat,team,c)]).length;
  const allOwned = isTeamFullyOwned(cat, team);

  block.innerHTML = `
    <div class="team-head">
      <div class="team-name">${team}${labelExtra ? `<span class="from-cat">${labelExtra}</span>` : ""}</div>
      <div class="team-head-right">
        <button class="team-select-btn">${allOwned ? "✕ 取消全選" : "✅ 全選"}</button>
        <div class="team-progress"><b>${gotInTeam}</b> / ${cards.length}</div>
      </div>
    </div>
    <div class="card-grid"></div>
  `;

  const selectBtn = block.querySelector(".team-select-btn");
  selectBtn.onclick = async (e)=>{
    e.stopPropagation();
    const newVal = !allOwned;
    DATA[cat][team].forEach(card=>{
      owned[cardId(cat,team,card)] = newVal;
    });
    if(missingViewActive) buildMissingView();
    else if(teamMatches.length>0) buildTeamSearchResults();
    else buildPanels();
    buildTabs();
    updateStats();
    await saveOwned();
  };

  const grid = block.querySelector(".card-grid");
  cards.forEach(card=>{
    const id = cardId(cat,team,card);
    const chip = document.createElement("div");
    chip.className = "card-chip" + (owned[id] ? " got":"");
    chip.dataset.name = card.toLowerCase();
    chip.innerHTML = `<span class="mark">✓</span><span>${card}</span>`;
    chip.onclick = ()=> toggleCard(id, chip, block, cat);
    grid.appendChild(chip);
  });
  return block;
}

function buildPanels(){
  const panelsEl = document.getElementById("panels");
  panelsEl.innerHTML = "";
  Object.keys(DATA).forEach(cat=>{
    const panel = document.createElement("div");
    panel.className = "cat-panel" + (cat===activeCat ? " active":"");
    panel.dataset.cat = cat;

    if(CAT_NOTES[cat]){
      const banner = document.createElement("div");
      banner.className = "cat-note-banner";
      banner.textContent = "特徵：" + CAT_NOTES[cat];
      panel.appendChild(banner);
    }

    Object.keys(DATA[cat]).forEach(team=>{
      const cards = DATA[cat][team];
      panel.appendChild(makeCardGridBlock(cat, team, cards, null));
    });

    panelsEl.appendChild(panel);
  });
}

function buildTeamSearchResults(){
  const container = document.getElementById("teamSearchResults");
  container.innerHTML = "";

  const title = document.createElement("div");
  title.className = "team-search-title";
  title.innerHTML = `隊名搜尋結果：<b>${teamMatches.join(" / ")}</b>（顯示所有卡款中的相關卡片）`;
  container.appendChild(title);

  Object.keys(DATA).forEach(cat=>{
    teamMatches.forEach(team=>{
      if(DATA[cat][team]){
        const label = CAT_NOTES[cat] ? `${cat}（${CAT_NOTES[cat]}）` : cat;
        container.appendChild(makeCardGridBlock(cat, team, DATA[cat][team], label));
      }
    });
  });
}

const MISSING_TEAM_COLORS = {
  "CFO":"#e0b04d","DCG":"#4fc3f7","DFM":"#3b6fd6","GAM":"#f5a623",
  "GZ":"#6cc24a","MVK":"#ff6a3d","SHG":"#f0c419","TSW":"#d5dbe0",
  "主播/賽評":"#e0895c","隊伍":"#ff7a3d","雙人隱藏卡":"#c084fc"
};
function missingTeamColor(team){ return MISSING_TEAM_COLORS[team] || "#cbb8ad"; }

function buildMissingCanvas(missingData){
  const W = 1100;
  const PAD = 32;
  const contentW = W - PAD*2;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = 10;
  const ctx = canvas.getContext('2d');

  function fitText(text, maxWidth, font){
    ctx.font = font;
    if(ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while(t.length > 1 && ctx.measureText(t+"…").width > maxWidth){
      t = t.slice(0,-1);
    }
    return t + "…";
  }
  function drawCross(cx, cy, r){
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle = "#5a4239";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.strokeStyle = "#c96a5a";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx-r*0.4, cy-r*0.4); ctx.lineTo(cx+r*0.4, cy+r*0.4);
    ctx.moveTo(cx+r*0.4, cy-r*0.4); ctx.lineTo(cx-r*0.4, cy+r*0.4);
    ctx.stroke();
  }

  const colGap = 10, rowH = 26, colHeaderH = 26, headerBarH = 32, innerPad = 14;
  const teamsPerRowCap = 4, teamRowGap = 10, sectionGap = 14, headerH = 56;

  const catKeys = Object.keys(missingData);
  const sectionMeta = {};
  catKeys.forEach(cat=>{
    const teams = Object.keys(missingData[cat]);
    const maxRows = Math.max(...teams.map(t=>missingData[cat][t].length));
    const numTeamRows = Math.ceil(teams.length / teamsPerRowCap);
    const teamsPerRow = Math.ceil(teams.length / numTeamRows);
    const perRowGridH = colHeaderH + maxRows*rowH;
    const gridH = numTeamRows*perRowGridH + (numTeamRows-1)*teamRowGap;
    const blockH = innerPad*2 + headerBarH + 6 + gridH;
    sectionMeta[cat] = {teams, maxRows, teamsPerRow, perRowGridH, blockH, note: CAT_NOTES[cat] || ""};
  });

  const totalSectionsH = catKeys.reduce((s,cat)=>s+sectionMeta[cat].blockH+sectionGap, 0);
  const totalH = headerH + totalSectionsH + PAD;
  canvas.height = totalH;

  const bgGrad = ctx.createLinearGradient(0,0,0,totalH);
  bgGrad.addColorStop(0, "#1b1210");
  bgGrad.addColorStop(1, "#120c0a");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,totalH);

  ctx.fillStyle = "#f4ece6";
  ctx.font = "900 24px sans-serif";
  ctx.fillText("還沒有的卡", PAD, 40);

  function drawPanel(cat, x, y, w, h){
    const sec = sectionMeta[cat];
    ctx.fillStyle = "#1f1512";
    roundRect(ctx, x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = "#3a2620";
    ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 12);
    ctx.stroke();

    ctx.fillStyle = "#ffb347";
    ctx.font = "900 16px sans-serif";
    const noteStr = sec.note ? `（${sec.note}）` : "";
    ctx.fillText(`${cat}${noteStr}`, x+innerPad, y+innerPad+14);

    const gridX = x + innerPad;
    const gridY = y + innerPad + headerBarH + 6;
    const gridW = w - innerPad*2;
    const teamsPerRow = sec.teamsPerRow;
    const colW = (gridW - colGap*(teamsPerRow-1)) / teamsPerRow;

    sec.teams.forEach((team, i)=>{
      const teamRowIdx = Math.floor(i / teamsPerRow);
      const colIdx = i % teamsPerRow;
      const colX = gridX + colIdx*(colW+colGap);
      const rowBandY = gridY + teamRowIdx*(sec.perRowGridH + teamRowGap);
      const tColor = missingTeamColor(team);

      ctx.fillStyle = tColor + "26";
      roundRect(ctx, colX, rowBandY, colW, colHeaderH-4, 6);
      ctx.fill();
      ctx.strokeStyle = tColor + "80";
      ctx.lineWidth = 1;
      roundRect(ctx, colX, rowBandY, colW, colHeaderH-4, 6);
      ctx.stroke();

      ctx.fillStyle = tColor;
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      const headerLabel = fitText(team, colW-8, "bold 13px sans-serif");
      ctx.fillText(headerLabel, colX+colW/2, rowBandY+(colHeaderH-4)/2+4);
      ctx.textAlign = "left";

      missingData[cat][team].forEach((card, j)=>{
        const rowY = rowBandY + colHeaderH + j*rowH;
        const iconCx = colX + 10;
        const iconCy = rowY + rowH/2;
        drawCross(iconCx, iconCy, 7);

        ctx.fillStyle = "#cbb8ad";
        ctx.font = "15px sans-serif";
        const label = fitText(card, colW-28, "15px sans-serif");
        ctx.fillText(label, colX+22, rowY+rowH/2+5);
      });
    });
  }

  let cy = headerH;
  catKeys.forEach(cat=>{
    const rh = sectionMeta[cat].blockH;
    drawPanel(cat, PAD, cy, contentW, rh);
    cy += rh + sectionGap;
  });

  return canvas;
}

function buildMissingView(){
  const container = document.getElementById("missingView");
  container.innerHTML = "";

  const totalAll = totalCardsAll();
  const gotAll = gotCardsAll();
  const missingCount = totalAll - gotAll;

  const title = document.createElement("div");
  title.className = "team-search-title";
  title.innerHTML = `還缺 <b>${missingCount}</b> 張卡（僅供瀏覽，要標記已蒐集請回到分類頁籤）`;
  container.appendChild(title);

  if(missingCount === 0){
    const done = document.createElement("div");
    done.className = "missing-done";
    done.textContent = "🎉 全部蒐集完成了，沒有缺的卡片！";
    container.appendChild(done);
    return;
  }

  const missingData = {};
  Object.keys(DATA).forEach(cat=>{
    const teamsWithMissing = {};
    Object.keys(DATA[cat]).forEach(team=>{
      const missing = DATA[cat][team].filter(c=>!owned[cardId(cat,team,c)]);
      if(missing.length>0) teamsWithMissing[team] = missing;
    });
    if(Object.keys(teamsWithMissing).length>0) missingData[cat] = teamsWithMissing;
  });

  const canvas = buildMissingCanvas(missingData);
  canvas.style.maxWidth = "100%";
  canvas.style.height = "auto";
  canvas.style.display = "block";
  canvas.style.borderRadius = "12px";
  container.appendChild(canvas);
}

async function toggleCard(id, chip, block, cat){
  owned[id] = !owned[id];
  chip.classList.toggle("got");
  const teamCards = chip.parentElement.querySelectorAll(".card-chip");
  const gotN = Array.from(teamCards).filter(c=>c.classList.contains("got")).length;
  block.querySelector(".team-progress b").textContent = gotN;
  updateStats();
  buildTabs();
  if(missingViewActive) buildMissingView();
  await saveOwned();
}

function updateStats(){
  const totalAll = totalCardsAll();
  const gotAll = gotCardsAll();
  const pct = totalAll ? Math.round(gotAll/totalAll*100) : 0;
  document.getElementById("gotCount").textContent = gotAll;
  document.getElementById("totalCount").textContent = totalAll;
  document.getElementById("ringPct").textContent = pct + "%";
  document.getElementById("ring").style.setProperty("--pct", pct);
  document.getElementById("catStatLine").textContent =
    teamMatches.length>0
      ? `隊名搜尋：${teamMatches.join("/")}`
      : `目前分類：${gotCardsInCat(activeCat)} / ${totalCardsInCat(activeCat)}`;
}

function applySearch(){
  const raw = document.getElementById("search").value.trim();
  searchTerm = raw.toLowerCase();

  const upper = raw.toUpperCase();
  teamMatches = raw.length>=2
    ? TEAM_CODES.filter(code => code.startsWith(upper))
    : [];

  const panelsEl = document.getElementById("panels");
  const teamResultsEl = document.getElementById("teamSearchResults");

  if(teamMatches.length>0){
    panelsEl.style.display = "none";
    teamResultsEl.classList.add("active");
    buildTeamSearchResults();
  }else{
    panelsEl.style.display = "";
    teamResultsEl.classList.remove("active");
    document.querySelectorAll(".card-chip").forEach(chip=>{
      const match = !searchTerm || chip.dataset.name.includes(searchTerm);
      chip.classList.toggle("hidden", !match);
    });
  }
  buildTabs();
  updateStats();
}

function render(){
  buildTabs();
  buildPanels();
  updateStats();
  applySearch();
}

async function loadOwned(){
  detectStorageBackend();
  try{
    const val = await storageGetValue(STORAGE_KEY);
    if(val){
      owned = JSON.parse(val);
    }
  }catch(e){
    owned = {};
  }
}

let saveTimer = null;
let saveInFlight = false;
let pendingSaveWanted = false;

function setSaveStatus(text, isError){
  const el = document.getElementById("saveStatus");
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? "#ff8a7a" : "var(--text-2)";
}

function saveOwned(){
  // 防抖：短時間內多次點擊只會在最後一次觸發後才真正送出
  pendingSaveWanted = true;
  setSaveStatus("儲存中...", false);
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
}

async function flushSave(){
  if(saveInFlight){
    // 上一次還在送出，稍後再排一次
    saveTimer = setTimeout(flushSave, 500);
    return;
  }
  pendingSaveWanted = false;
  saveInFlight = true;

  const payload = JSON.stringify(owned);
  const maxAttempts = 3;

  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      await storageSetValue(STORAGE_KEY, payload);
      setSaveStatus(storageBackend === "local" ? "✓ 已儲存在此瀏覽器" : "✓ 已儲存", false);
      saveInFlight = false;
      if(pendingSaveWanted){
        saveTimer = setTimeout(flushSave, 500);
      }
      return;
    }catch(e){
      console.error(`儲存失敗（第 ${attempt} 次）`, e);
      if(attempt < maxAttempts){
        await new Promise(r=>setTimeout(r, attempt*800));
      }else{
        setSaveStatus("⚠ 儲存失敗，勾選仍會保留在畫面上，稍後會自動重試", true);
      }
    }
  }
  saveInFlight = false;
  // 全部重試失敗後，過一段時間再自動嘗試一次
  saveTimer = setTimeout(flushSave, 5000);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function exportImage(){
  const W = 1200;
  const PAD = 40;
  const contentW = W - PAD*2;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = 10;
  const ctx = canvas.getContext('2d');

  const TEAM_COLORS = {
    "CFO":"#e0b04d",       // CTBC Flying Oyster：藏青盾牌上的金色字樣
    "DCG":"#4fc3f7",       // DetonatioN FM：黑藍雙色環的藍
    "DFM":"#3b6fd6",       // Deep Cross Gaming：藍黑X字標
    "GAM":"#f5a623",       // GAM Esports：金色雄鷹
    "GZ":"#6cc24a",        // Ground Zero：綠色幸運草
    "MVK":"#ff6a3d",       // MVK Esports：橘紅閃電
    "SHG":"#f0c419",       // SoftBank Hawks：黃黑配色
    "TSW":"#d5dbe0",       // Team Secret Whales：灰白配色
    "主播/賽評":"#e0895c","隊伍":"#ff7a3d","雙人隱藏卡":"#c084fc"
  };
  function teamColor(team){ return TEAM_COLORS[team] || "#cbb8ad"; }

  function fitText(text, maxWidth, font){
    ctx.font = font;
    if(ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while(t.length > 1 && ctx.measureText(t+"…").width > maxWidth){
      t = t.slice(0,-1);
    }
    return t + "…";
  }

  function drawCheck(cx, cy, r){
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle = "#2fae6b";
    ctx.fill();
    ctx.strokeStyle = "#eafff2";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx-r*0.5, cy+r*0.05);
    ctx.lineTo(cx-r*0.1, cy+r*0.45);
    ctx.lineTo(cx+r*0.55, cy-r*0.4);
    ctx.stroke();
  }
  function drawCross(cx, cy, r){
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle = "#4a352c";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.strokeStyle = "#a85c4c";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(cx-r*0.4, cy-r*0.4); ctx.lineTo(cx+r*0.4, cy+r*0.4);
    ctx.moveTo(cx+r*0.4, cy-r*0.4); ctx.lineTo(cx-r*0.4, cy+r*0.4);
    ctx.stroke();
  }

  // 每個分類 = 一張表：隊伍每行最多4個，超過自動換到下一行
  // 這樣每欄能拿到足夠寬度，名字不會被截斷成「...」
  const colGap = 10;
  const rowH = 28;
  const colHeaderH = 28;
  const headerBarH = 34;
  const innerPad = 16;
  const teamsPerRowCap = 4;
  const teamRowGap = 12;
  const FORCE_TEAM_ROWS = { "閃卡B+隊伍卡": 2 };

  const sectionMeta = {};
  Object.keys(DATA).forEach(cat=>{
    const teams = Object.keys(DATA[cat]);
    const maxRows = Math.max(...teams.map(t=>DATA[cat][t].length));
    let got = 0, total = 0;
    teams.forEach(t=>DATA[cat][t].forEach(card=>{
      total++;
      if(owned[cardId(cat,t,card)]) got++;
    }));
    const numTeamRows = FORCE_TEAM_ROWS[cat] || Math.ceil(teams.length / teamsPerRowCap);
    const teamsPerRow = Math.ceil(teams.length / numTeamRows);
    const perRowGridH = colHeaderH + maxRows*rowH;
    const gridH = numTeamRows*perRowGridH + (numTeamRows-1)*teamRowGap;
    const blockH = innerPad*2 + headerBarH + 6 + gridH;
    sectionMeta[cat] = {cat, note: CAT_NOTES[cat] || "", teams, maxRows, got, total, blockH, numTeamRows, teamsPerRow, perRowGridH};
  });

  const catKeys = Object.keys(DATA);
  const rows = catKeys.map(cat=>[cat]); // 每個分類獨立整行
  const rowHeights = rows.map(r => Math.max(...r.map(c=>sectionMeta[c].blockH)));

  const totalAll = totalCardsAll();
  const gotAll = gotCardsAll();
  const pct = totalAll ? Math.round(gotAll/totalAll*100) : 0;
  const dateStr = new Date().toLocaleDateString('zh-TW');

  const headerH = 165;
  const sectionGap = 14;
  const totalSectionsH = rowHeights.reduce((s,h)=>s+h+sectionGap,0);
  const footerH = 50;
  const totalH = headerH + totalSectionsH + footerH + PAD;

  canvas.height = totalH;

  const bgGrad = ctx.createLinearGradient(0,0,0,totalH);
  bgGrad.addColorStop(0, "#1b1210");
  bgGrad.addColorStop(1, "#120c0a");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,totalH);

  const glow = ctx.createRadialGradient(120,40,10,120,40,280);
  glow.addColorStop(0, "rgba(201,67,42,0.35)");
  glow.addColorStop(1, "rgba(201,67,42,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,320);

  const rawNickname = document.getElementById("nicknameInput").value.trim();
  const nickname = rawNickname || "我";

  ctx.fillStyle = "#ffb347";
  ctx.font = "bold 14px sans-serif";
  ctx.fillText("LCP 2026 · MADE FOR THIS", PAD, 42);

  // 暱稱用大字放大呈現，「的LCP小卡」用小字接在後面
  ctx.fillStyle = "#f4ece6";
  ctx.font = "900 48px sans-serif";
  const nickDisplay = fitText(nickname, W-PAD*2-260, "900 48px sans-serif");
  ctx.fillText(nickDisplay, PAD, 92);
  const nickW = ctx.measureText(nickDisplay).width;

  ctx.fillStyle = "#cbb8ad";
  ctx.font = "700 22px sans-serif";
  ctx.fillText("的LCP小卡", PAD + nickW + 10, 92);

  ctx.fillStyle = "#cbb8ad";
  ctx.font = "14px sans-serif";
  ctx.fillText(`統計時間：${dateStr}`, PAD, 118);

  ctx.textAlign = "right";
  ctx.fillStyle = "#ff7a3d";
  ctx.font = "900 42px sans-serif";
  ctx.fillText(`${pct}%`, W-PAD, 72);
  ctx.fillStyle = "#cbb8ad";
  ctx.font = "14px sans-serif";
  ctx.fillText(`已蒐集 ${gotAll} / ${totalAll} 張`, W-PAD, 95);
  ctx.textAlign = "left";

  ctx.strokeStyle = "#3a2620";
  ctx.beginPath();
  ctx.moveTo(PAD, headerH-10);
  ctx.lineTo(W-PAD, headerH-10);
  ctx.stroke();

  function drawPanel(cat, x, y, w, h){
    const sec = sectionMeta[cat];
    ctx.fillStyle = "#1f1512";
    roundRect(ctx, x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = "#3a2620";
    ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 12);
    ctx.stroke();

    ctx.fillStyle = "#ffb347";
    ctx.font = "900 18px sans-serif";
    const noteStr = sec.note ? `（${sec.note}）` : "";
    ctx.fillText(`${sec.cat}${noteStr}`, x+innerPad, y+innerPad+16);

    ctx.textAlign = "right";
    ctx.fillStyle = "#cbb8ad";
    ctx.font = "14px sans-serif";
    ctx.fillText(`${sec.got} / ${sec.total}`, x+w-innerPad, y+innerPad+16);
    ctx.textAlign = "left";

    const gridX = x + innerPad;
    const gridY = y + innerPad + headerBarH + 6;
    const gridW = w - innerPad*2;
    const teamsPerRow = sec.teamsPerRow;
    const colW = (gridW - colGap*(teamsPerRow-1)) / teamsPerRow;

    sec.teams.forEach((team, i)=>{
      const teamRowIdx = Math.floor(i / teamsPerRow);
      const colIdx = i % teamsPerRow;
      const colX = gridX + colIdx*(colW+colGap);
      const rowBandY = gridY + teamRowIdx*(sec.perRowGridH + teamRowGap);
      const tColor = teamColor(team);

      ctx.fillStyle = tColor + "26";
      roundRect(ctx, colX, rowBandY, colW, colHeaderH-4, 6);
      ctx.fill();
      ctx.strokeStyle = tColor + "80";
      ctx.lineWidth = 1;
      roundRect(ctx, colX, rowBandY, colW, colHeaderH-4, 6);
      ctx.stroke();

      ctx.fillStyle = tColor;
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      const headerLabel = fitText(team, colW-8, "bold 14px sans-serif");
      ctx.fillText(headerLabel, colX+colW/2, rowBandY+(colHeaderH-4)/2+5);
      ctx.textAlign = "left";

      const cards = DATA[sec.cat][team];
      cards.forEach((card, j)=>{
        const rowY = rowBandY + colHeaderH + j*rowH;
        const isOwned = !!owned[cardId(sec.cat, team, card)];
        const iconCx = colX + 11;
        const iconCy = rowY + rowH/2;
        if(isOwned) drawCheck(iconCx, iconCy, 8);
        else drawCross(iconCx, iconCy, 8);

        ctx.fillStyle = isOwned ? "#eef7f0" : "#8a766c";
        ctx.font = "17px sans-serif";
        const label = fitText(card, colW-30, "17px sans-serif");
        ctx.fillText(label, colX+24, rowY+rowH/2+6);
      });
    });
  }

  let cy = headerH + 10;
  rows.forEach((rowCats, idx)=>{
    const rh = rowHeights[idx];
    drawPanel(rowCats[0], PAD, cy, contentW, rh);
    cy += rh + sectionGap;
  });

  ctx.fillStyle = "#8a7369";
  ctx.font = "13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("由 LCP 小卡蒐集盤點工具產生 · Threads @kunkuniv", W/2, totalH-24);
  ctx.textAlign = "left";

  const link = document.createElement('a');
  link.download = `LCP2026_我的LCP小卡_${dateStr.replace(/\//g,'-')}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById("exportBtn").addEventListener("click", exportImage);

document.getElementById("missingBtn").addEventListener("click", ()=>{
  missingViewActive = !missingViewActive;
  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");
  const teamResultsEl = document.getElementById("teamSearchResults");
  const missingEl = document.getElementById("missingView");
  const missingBtn = document.getElementById("missingBtn");

  if(missingViewActive){
    tabsEl.style.display = "none";
    panelsEl.style.display = "none";
    teamResultsEl.classList.remove("active");
    missingEl.classList.add("active");
    missingBtn.textContent = "⬅ 返回分類";
    buildMissingView();
  }else{
    tabsEl.style.display = "";
    panelsEl.style.display = "";
    missingEl.classList.remove("active");
    missingBtn.textContent = "📋 還沒有的卡";
    render();
  }
});
