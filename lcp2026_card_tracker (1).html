<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>LCP 2026 小卡蒐集清單</title>
<style>
  :root{
    --bg-0:#120c0a;
    --bg-1:#1b1210;
    --bg-2:#241713;
    --line:#3a2620;
    --ember-1:#ff7a3d;
    --ember-2:#ffb347;
    --magma:#c9432a;
    --text-0:#f4ece6;
    --text-1:#cbb8ad;
    --text-2:#8a7369;
    --got:#2fae6b;
    --got-bg:rgba(47,174,107,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,67,42,0.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,122,61,0.12), transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    padding:20px 14px 60px;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .title-block .eyebrow{
    font-size:11px;
    letter-spacing:3px;
    color:var(--ember-2);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    margin:0;
    font-size:26px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--text-0),var(--ember-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{color:var(--text-2);font-size:13px;margin-top:4px;}

  .stat-ring{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ring{
    width:72px;height:72px;border-radius:50%;
    background:conic-gradient(var(--ember-1) calc(var(--pct,0)*1%), #33221c calc(var(--pct,0)*1%));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    position:relative;
  }
  .ring::before{
    content:"";
    position:absolute;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--bg-0);
  }
  .ring span{position:relative;font-weight:800;font-size:15px;}
  .stat-text .n{font-size:13px;color:var(--text-1);}
  .stat-text .n b{color:var(--text-0);}

  .toolbar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;
  }
  .tab{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-1);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    text-align:center;
    line-height:1.4;
  }
  .tab .cnt{color:var(--text-2);font-weight:500;margin-left:4px;}
  .tab .note{
    display:block;
    font-size:10px;
    font-weight:500;
    letter-spacing:0.5px;
    color:var(--text-2);
    margin-top:1px;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--magma),var(--ember-1));
    border-color:transparent;
    color:#1a0e0a;
  }
  .tab.active .cnt{color:#3a1c0e;}
  .tab.active .note{color:#4a2412;}
  .tab:hover{border-color:var(--ember-1);}
  .tab.dimmed{opacity:0.45;}

  .searchrow{
    display:flex;gap:8px;margin-bottom:8px;
  }
  input[type=text]{
    flex:1;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-0);
    padding:10px 14px;
    border-radius:10px;
    font-size:14px;
  }
  input[type=text]:focus{outline:none;border-color:var(--ember-1);}
  .reset-btn{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-2);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .reset-btn:hover{color:#ff8a7a;border-color:#7a3428;}

  .search-hint{
    font-size:11px;
    color:var(--text-2);
    margin-bottom:18px;
  }
  .search-hint b{color:var(--ember-2);}

  .cat-panel{display:none;}
  .cat-panel.active{display:block;}

  .cat-note-banner{
    display:inline-block;
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--ember-2);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:8px;
    margin-bottom:16px;
  }

  .team-block{
    margin-bottom:22px;
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px 16px;
  }
  .team-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    flex-wrap:wrap;
    gap:6px;
  }
  .team-name{
    font-weight:900;
    font-size:15px;
    letter-spacing:1px;
    color:var(--ember-2);
  }
  .team-name .from-cat{
    font-size:11px;
    font-weight:700;
    color:var(--text-2);
    margin-left:8px;
  }
  .team-progress{font-size:12px;color:var(--text-2);}
  .team-progress b{color:var(--text-1);}

  .card-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .card-chip{
    position:relative;
    border:1px solid var(--line);
    background:var(--bg-2);
    color:var(--text-1);
    padding:9px 13px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
    transition:all .12s ease;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card-chip:hover{border-color:var(--ember-1);color:var(--text-0);}
  .card-chip.got{
    background:var(--got-bg);
    border-color:var(--got);
    color:#c9f5da;
  }
  .card-chip .mark{
    width:14px;height:14px;
    border-radius:4px;
    border:1.5px solid var(--text-2);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;
    color:transparent;
  }
  .card-chip.got .mark{
    border-color:var(--got);
    background:var(--got);
    color:#0e1f16;
  }
  .card-chip.hidden{display:none;}

  #teamSearchResults{display:none;}
  #teamSearchResults.active{display:block;}
  .team-search-title{
    font-size:13px;
    color:var(--text-1);
    margin-bottom:14px;
  }
  .team-search-title b{color:var(--ember-2);}

  footer{
    text-align:center;
    color:var(--text-2);
    font-size:11px;
    margin-top:30px;
    letter-spacing:1px;
  }

  .loading{
    text-align:center;
    color:var(--text-2);
    padding:40px 0;
    font-size:13px;
  }

  @media (max-width:560px){
    h1{font-size:21px;}
    .stat-ring{width:100%;justify-content:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">LCP 2026 · MADE FOR THIS</div>
      <h1>小卡蒐集盤點</h1>
      <div class="subtitle">點卡片標記持有,進度自動儲存</div>
    </div>
    <div class="stat-ring">
      <div class="ring" id="ring"><span id="ringPct">0%</span></div>
      <div class="stat-text">
        <div class="n">已蒐集 <b id="gotCount">0</b> / <span id="totalCount">0</span></div>
        <div class="n" id="catStatLine">目前分類：0 / 0</div>
      </div>
    </div>
  </header>

  <div class="toolbar" id="tabs"></div>

  <div class="searchrow">
    <input type="text" id="search" placeholder="搜尋選手/主播名稱，或輸入隊名如 CFO 查全部類型...">
    <button class="reset-btn" id="resetBtn">清空目前分類</button>
  </div>
  <div class="search-hint">輸入隊名代碼（如 <b>CFO</b>、<b>DCG</b>）可一次看到該隊在所有卡款中的卡片</div>

  <div id="panels">
    <div class="loading">載入進度中...</div>
  </div>

  <div id="teamSearchResults"></div>

  <footer>資料點擊即儲存 · 僅存於你自己的裝置紀錄</footer>
</div>

<script>
const DATA = {
  "一般卡A款": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino","Chawy"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang","Refra1n"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody","Rayfarky","Paz"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki","Gloryy","Naul"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca","Skywalk"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller","Bigkoro"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta","Corgi"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie","Hiro02","Warhorse"]
  },
  "一般卡B款": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki","Gloryy"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie"]
  },
  "特別卡A款": {
    "CFO":["Rest","Shadow","Doggo"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie"]
  },
  "特別卡B款": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino","Chawy"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang","Refra1n"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody","Paz"],
    "GAM":["Kiaya","Draktharr","Aress","Artemis","Taki","Gloryy","Naul"],
    "GZ":["1Jiang","Husha","JimieN","Shunn","Orca","Skywalk"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller","Bigkoro"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta","Corgi"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie","Warhorse"],
    "Caster/Host":["Jackie","Section","JR","Mattlin","Rhan","Tommy","Art","Mountain","Zod","Jay","Chenzui"]
  },
  "親簽卡": {
    "CFO":["Rest","Shadow","Pout","Doggo","Kino"],
    "DCG":["Flauren","Pop9","HongSuo","Feng","ShiauC","XiaoXiang"],
    "DFM":["Momo","Citrus","Fisher","Kakkun","Woody"],
    "GAM":["Kiaya","Draktharr","Artemis","Taki","Gloryy"],
    "GZ":["1Jiang","Husha"],
    "MVK":["Kratos","Gury","Chika","Harky","Siuloong","Sofm","Seany","Steller"],
    "SHG":["Evi","Van1","Aria","Marble","Vsta"],
    "TSW":["Pun","Hizto","Dire","Eddie","Bie"]
  },
  "印簽卡": {
    "GAM":["Aress"],
    "GZ":["JimieN","Shunn","Orca"]
  },
  "隊伍卡": {
    "隊伍":["CFO","DCG","DFM","GAM","GZ","MVK","SHG","TSW"]
  }
};

const CAT_NOTES = {
  "一般卡A款": "正臉去背",
  "一般卡B款": "側臉有背景",
  "特別卡A款": "背景有隊名",
  "特別卡B款": "銀色外框"
};

const TEAM_CODES = ["CFO","DCG","DFM","GAM","GZ","MVK","SHG","TSW"];

const STORAGE_KEY = "lcp2026_owned_cards";
let owned = {};
let activeCat = Object.keys(DATA)[0];
let searchTerm = "";
let teamMatches = [];

function cardId(cat, team, card){ return cat+"__"+team+"__"+card; }

function totalCardsInCat(cat){
  return Object.values(DATA[cat]).reduce((s,arr)=>s+arr.length,0);
}
function totalCardsAll(){
  return Object.keys(DATA).reduce((s,cat)=>s+totalCardsInCat(cat),0);
}
function gotCardsInCat(cat){
  let c=0;
  for(const team in DATA[cat]){
    for(const card of DATA[cat][team]){
      if(owned[cardId(cat,team,card)]) c++;
    }
  }
  return c;
}
function gotCardsAll(){
  let c=0;
  for(const k in owned) if(owned[k]) c++;
  return c;
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(DATA).forEach(cat=>{
    const tab = document.createElement("div");
    const isActive = cat===activeCat && teamMatches.length===0;
    tab.className = "tab" + (isActive ? " active":"") + (teamMatches.length>0 ? " dimmed":"");
    const note = CAT_NOTES[cat] ? `<span class="note">${CAT_NOTES[cat]}</span>` : "";
    tab.innerHTML = `${cat} <span class="cnt">${gotCardsInCat(cat)}/${totalCardsInCat(cat)}</span>${note}`;
    tab.onclick = ()=>{
      activeCat = cat;
      document.getElementById("search").value = "";
      searchTerm = "";
      teamMatches = [];
      render();
    };
    tabsEl.appendChild(tab);
  });
}

function makeCardGridBlock(cat, team, cards, labelExtra){
  const block = document.createElement("div");
  block.className = "team-block";
  const gotInTeam = cards.filter(c=>owned[cardId(cat,team,c)]).length;

  block.innerHTML = `
    <div class="team-head">
      <div class="team-name">${team}${labelExtra ? `<span class="from-cat">${labelExtra}</span>` : ""}</div>
      <div class="team-progress"><b>${gotInTeam}</b> / ${cards.length}</div>
    </div>
    <div class="card-grid"></div>
  `;
  const grid = block.querySelector(".card-grid");
  cards.forEach(card=>{
    const id = cardId(cat,team,card);
    const chip = document.createElement("div");
    chip.className = "card-chip" + (owned[id] ? " got":"");
    chip.dataset.name = card.toLowerCase();
    chip.innerHTML = `<span class="mark">✓</span><span>${card}</span>`;
    chip.onclick = ()=> toggleCard(id, chip, block, cat);
    grid.appendChild(chip);
  });
  return block;
}

function buildPanels(){
  const panelsEl = document.getElementById("panels");
  panelsEl.innerHTML = "";
  Object.keys(DATA).forEach(cat=>{
    const panel = document.createElement("div");
    panel.className = "cat-panel" + (cat===activeCat ? " active":"");
    panel.dataset.cat = cat;

    if(CAT_NOTES[cat]){
      const banner = document.createElement("div");
      banner.className = "cat-note-banner";
      banner.textContent = "特徵：" + CAT_NOTES[cat];
      panel.appendChild(banner);
    }

    Object.keys(DATA[cat]).forEach(team=>{
      const cards = DATA[cat][team];
      panel.appendChild(makeCardGridBlock(cat, team, cards, null));
    });

    panelsEl.appendChild(panel);
  });
}

function buildTeamSearchResults(){
  const container = document.getElementById("teamSearchResults");
  container.innerHTML = "";

  const title = document.createElement("div");
  title.className = "team-search-title";
  title.innerHTML = `隊名搜尋結果：<b>${teamMatches.join(" / ")}</b>（顯示所有卡款中的相關卡片）`;
  container.appendChild(title);

  Object.keys(DATA).forEach(cat=>{
    teamMatches.forEach(team=>{
      if(DATA[cat][team]){
        const label = CAT_NOTES[cat] ? `${cat}（${CAT_NOTES[cat]}）` : cat;
        container.appendChild(makeCardGridBlock(cat, team, DATA[cat][team], label));
      }
    });
  });
}

async function toggleCard(id, chip, block, cat){
  owned[id] = !owned[id];
  chip.classList.toggle("got");
  const teamCards = chip.parentElement.querySelectorAll(".card-chip");
  const gotN = Array.from(teamCards).filter(c=>c.classList.contains("got")).length;
  block.querySelector(".team-progress b").textContent = gotN;
  updateStats();
  buildTabs();
  await saveOwned();
}

function updateStats(){
  const totalAll = totalCardsAll();
  const gotAll = gotCardsAll();
  const pct = totalAll ? Math.round(gotAll/totalAll*100) : 0;
  document.getElementById("gotCount").textContent = gotAll;
  document.getElementById("totalCount").textContent = totalAll;
  document.getElementById("ringPct").textContent = pct + "%";
  document.getElementById("ring").style.setProperty("--pct", pct);
  document.getElementById("catStatLine").textContent =
    teamMatches.length>0
      ? `隊名搜尋：${teamMatches.join("/")}`
      : `目前分類：${gotCardsInCat(activeCat)} / ${totalCardsInCat(activeCat)}`;
}

function applySearch(){
  const raw = document.getElementById("search").value.trim();
  searchTerm = raw.toLowerCase();

  const upper = raw.toUpperCase();
  teamMatches = raw.length>=2
    ? TEAM_CODES.filter(code => code.startsWith(upper))
    : [];

  const panelsEl = document.getElementById("panels");
  const teamResultsEl = document.getElementById("teamSearchResults");

  if(teamMatches.length>0){
    panelsEl.style.display = "none";
    teamResultsEl.classList.add("active");
    buildTeamSearchResults();
  }else{
    panelsEl.style.display = "";
    teamResultsEl.classList.remove("active");
    document.querySelectorAll(".card-chip").forEach(chip=>{
      const match = !searchTerm || chip.dataset.name.includes(searchTerm);
      chip.classList.toggle("hidden", !match);
    });
  }
  buildTabs();
  updateStats();
}

function render(){
  buildTabs();
  buildPanels();
  updateStats();
  applySearch();
}

async function loadOwned(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      owned = JSON.parse(result.value);
    }
  }catch(e){
    owned = {};
  }
}

async function saveOwned(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(owned), false);
  }catch(e){
    console.error("儲存失敗", e);
  }
}

document.getElementById("search").addEventListener("input", applySearch);

document.getElementById("resetBtn").addEventListener("click", async ()=>{
  if(teamMatches.length>0){
    alert("清空功能僅適用於分類頁籤，請先清除搜尋文字再操作。");
    return;
  }
  if(!confirm(`確定要清空「${activeCat}」目前的勾選紀錄嗎？`)) return;
  for(const team in DATA[activeCat]){
    for(const card of DATA[activeCat][team]){
      delete owned[cardId(activeCat,team,card)];
    }
  }
  render();
  await saveOwned();
});

(async function init(){
  await loadOwned();
  render();
})();
</script>
</body>
</html>
